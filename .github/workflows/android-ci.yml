name: Android CI

on:
  push:
    branches: [ "main", "develop", "feat/karaoke-ai-remix-dj-rooms" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Explicitly request platform-tools; the action's legacy default also
      # requests the removed SDK package named "tools".
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run DJ room server tests
        run: npm test --prefix server
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
